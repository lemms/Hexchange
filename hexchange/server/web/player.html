<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hexchange — Player view</title>
<link rel="stylesheet" href="/static/style.css?v=12">
<script>
  // report script errors and basic diagnostics to the server log
  (function () {
    const send = (kind, data) => { try { navigator.sendBeacon("/api/client-log", new Blob([JSON.stringify({ kind, page: location.pathname, ...data })], { type: "application/json" })); } catch (e) {} };
    window.addEventListener("error", e => send("error", { message: String(e.message), source: e.filename, line: e.lineno, col: e.colno }));
    window.addEventListener("unhandledrejection", e => send("rejection", { message: String(e.reason && (e.reason.stack || e.reason.message) || e.reason) }));
    window.__hxlog = send;
    send("load", { ua: navigator.userAgent, ui: "v3" });
  })();
</script>

</head>
<body>
<header>
  <h1><span>Hex</span>change</h1>
  <strong id="campName">–</strong>
  <span class="tick" id="tick"></span>
  <span id="where" style="color:var(--warn)"></span>
  <span class="spacer"></span>
  <button id="refresh">Refresh</button>
</header>
<main>
  <div id="mapwrap">
    <svg id="map"></svg>
    <div id="overlay">
      <select id="mode"><option value="polity">Polities</option><option value="price">Price of…</option></select>
      <select id="goodSel"></select>
    </div>
    <div id="legend"></div>
  </div>
  <aside>
    <div class="tabs"><button class="on">Market</button></div>
    <div><section class="pane on" id="pane"><p class="muted">Click a system. Prices are known only where your contacts report them.</p></section></div>
  </aside>
</main>
<script type="module" src="/static/player.js?v=12"></script>
</body>
</html>
